<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Journal Weekly Daily</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: oklch(0.970 0.012 75);
      --paper-2: oklch(0.988 0.008 80);
      --paper-edge: oklch(0.945 0.014 70);
      --ink: oklch(0.305 0.018 55);
      --ink-2: oklch(0.480 0.014 58);
      --ink-3: oklch(0.680 0.012 62);
      --ink-4: oklch(0.820 0.010 68);
      --rule: oklch(0.880 0.014 65);
      --rule-soft: oklch(0.935 0.012 70);
      --accent: oklch(0.660 0.070 42);
      --accent-wash: color-mix(in oklch, oklch(0.955 0.022 50) 55%, var(--paper-2));
    }

    html, body {
      min-height: 100%;
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      background:
        radial-gradient(1200px 600px at 18% -10%, var(--accent-wash), transparent 60%),
        radial-gradient(900px 500px at 90% 110%, var(--paper-edge), transparent 60%),
        var(--paper);
    }

    .font-serif { font-family: "Cormorant Garamond", Garamond, serif; }

    .paper-surface {
      background-color: var(--paper-2);
      background-image:
        radial-gradient(oklch(0.88 0.014 65 / 0.22) 0.5px, transparent 0.5px),
        radial-gradient(oklch(0.82 0.014 65 / 0.12) 0.5px, transparent 0.5px);
      background-size: 3px 3px, 7px 7px;
      background-position: 0 0, 1px 2px;
    }

    .page-shadow {
      box-shadow:
        0 30px 60px -24px oklch(0.30 0.02 55 / 0.22),
        0 2px 6px oklch(0.30 0.02 55 / 0.06);
    }

    .eyebrow {
      font-size: 9.5px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-2);
      font-weight: 500;
    }

    .pill-group {
      display: inline-flex;
      padding: 3px;
      border-radius: 999px;
      background: var(--paper-edge);
      border: 1px solid var(--rule-soft);
      gap: 2px;
    }

    .pill {
      appearance: none;
      border: 0;
      background: transparent;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 11.5px;
      letter-spacing: 0.02em;
      color: var(--ink-2);
      cursor: pointer;
      white-space: nowrap;
      text-decoration: none;
      transition: background .2s, color .2s, box-shadow .2s;
    }

    .pill[data-on="true"] {
      background: var(--paper-2);
      color: var(--ink);
      box-shadow: 0 1px 2px oklch(0.30 0.02 55 / 0.08), 0 0 0 1px var(--rule-soft);
    }

    .pill:hover:not([data-on="true"]) { color: var(--ink); }

    @media (max-width: 860px) {
      .pill-group {
        width: auto;
        max-width: 100%;
        justify-content: center;
        flex-wrap: nowrap;
      }

      .pill {
        flex: 0 0 auto;
        min-width: 0;
        text-align: center;
      }
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <div id="weekly-root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="weekly-daily.js"></script>
</body>
</html>
